<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Zoom Écran</title>
<style>
  :root { --acc: #4cc2ff; --bg: rgba(20,20,24,.82); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 14px/1.3 -apple-system, system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #overlay polygon { fill: rgba(76,194,255,.12); stroke: var(--acc); stroke-width: 2; }
  #overlay circle { fill: rgba(76,194,255,.35); stroke: #fff; stroke-width: 2; }
  #aimDot { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border: 2px solid #fff;
    border-radius: 50%; box-shadow: 0 0 0 1px #000; pointer-events: none; }
  #loupe { position: fixed; width: 130px; height: 130px; border-radius: 50%; border: 2px solid var(--acc);
    display: none; pointer-events: none; z-index: 7; background: #000; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: none; background: #000; }
  body.rect #gl { display: block; }
  body.rect #video, body.rect #overlay, body.rect #aimDot { visibility: hidden; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; background: #000; }
  #start button { font-size: 18px; padding: 14px 28px; border-radius: 30px; border: 0;
    background: var(--acc); color: #000; font-weight: 600; }
  #err { color: #ff7a7a; max-width: 340px; }
  .bar { position: fixed; left: 0; right: 0; padding: 8px 12px; background: var(--bg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 5; }
  #top { top: 0; padding-top: max(8px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; }
  #bottom { bottom: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .seg { display: flex; background: #111; border-radius: 18px; padding: 2px; border: 1px solid #333; }
  .seg button { border: 0; background: none; color: #fff; padding: 7px 14px; border-radius: 16px; font-size: 13px; }
  .seg button.on { background: var(--acc); color: #000; font-weight: 600; }
  #cam { background: #111; color: #fff; border: 1px solid #444; border-radius: 14px; padding: 6px 8px; font-size: 12px; max-width: 42vw; }
  #status { flex: 1; font-size: 11px; opacity: .75; text-align: right; }
  .row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .row label { width: 84px; font-size: 12px; opacity: .85; flex: none; }
  .row input[type=range] { flex: 1; accent-color: var(--acc); height: 28px; }
  .row output { width: 42px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .btns button { flex: 1 1 auto; min-width: 60px; padding: 10px 6px; border-radius: 10px;
    border: 1px solid #444; background: #222; color: #fff; font-size: 13px; }
  .btns button.on { background: var(--acc); color: #000; border-color: var(--acc); }
  .btns button.main { background: var(--acc); color: #000; border-color: var(--acc); font-weight: 600; }
  #adv { display: none; }
  #adv.open { display: block; }
  .chips { display: flex; gap: 6px; flex: 1; }
  .chips button { flex: 1; padding: 6px 4px; border-radius: 14px; border: 1px solid #555; background: #111; color: #fff; font-size: 12px; }
  .chips button.on { border-color: var(--acc); color: var(--acc); }
  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: var(--bg);
    padding: 8px 14px; border-radius: 16px; font-size: 13px; z-index: 6; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  body.hideui .bar { display: none; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <svg id="overlay"><polygon id="poly"/><g id="handles"></g></svg>
  <div id="aimDot"></div>
  <canvas id="gl"></canvas>
</div>
<canvas id="loupe" width="260" height="260"></canvas>
<div id="toast"></div>

<div id="start">
  <h2 style="margin:0">🖥️ Zoom Écran</h2>
  <p style="opacity:.75;max-width:340px;margin:0">Place le rond blanc sur l’écran d’ordinateur et appuie sur <b>Détecter</b> (ou touche l’écran dans l’image).<br>L’app zoome dessus et l’affiche redressé, comme vu de face.</p>
  <button id="go">Démarrer la caméra</button>
  <div id="err"></div>
</div>

<div id="top" class="bar">
  <div class="seg"><button id="mAim" class="on">Viser</button><button id="mRect">Redressé</button></div>
  <select id="cam"></select>
  <div id="status"></div>
</div>

<div id="bottom" class="bar">
  <div id="adv">
    <div class="row"><label>Format écran</label>
      <div class="chips" id="aspects"><button data-a="0" class="on">Auto</button><button data-a="1.7778">16:9</button><button data-a="1.6">16:10</button><button data-a="1.3333">4:3</button></div></div>
    <div class="row" id="hwRow" style="display:none"><label>Zoom caméra</label><input id="hw" type="range" step="0.1"><output id="hwOut"></output></div>
    <div class="row"><label>Netteté</label><input id="sharp" type="range" min="0" max="3" step="0.1" value="0.6"><output id="sharpOut"></output></div>
    <div class="row"><label>Contraste</label><input id="contrast" type="range" min="50" max="250" step="5" value="120"><output id="contrastOut"></output></div>
    <div class="row"><label>Luminosité</label><input id="bright" type="range" min="30" max="200" step="5" value="100"><output id="brightOut"></output></div>
    <div class="row" id="focusRow" style="display:none"><label>Mise au point</label><input id="focus" type="range"><output id="focusOut">auto</output></div>
  </div>
  <div class="btns">
    <button id="bDetect" class="main">Détecter</button>
    <button id="bTrack">Suivi</button>
    <button id="bFreeze">Figer</button>
    <button id="bSave">Photo</button>
    <button id="bAdv">⚙︎</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), stage = $('stage'), glc = $('gl');
let track = null, caps = {}, stream = null;
let corners = null;            // 4 coins en pixels vidéo : TL, TR, BR, BL
let mode = 'aim', tracking = false, frozen = false, aspect = 0, busy = false;
let view = { cx: .5, cy: .5, z: 1 }; // zoom/déplacement dans la vue redressée

const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.opacity = 0, 2200); }
function updateStatus() {
  if (!track) return;
  const s = track.getSettings();
  $('status').textContent = `${video.videoWidth}×${video.videoHeight}` + (caps.zoom ? ` · zoom ${(s.zoom || 1).toFixed(1)}×/${caps.zoom.max}×` : ' · pas de zoom optique');
}

// ---------- Caméra ----------
async function openStream(deviceId) {
  const base = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: 'environment' } };
  for (const size of [{ width: { ideal: 3840 }, height: { ideal: 2160 } }, { width: { ideal: 1920 }, height: { ideal: 1080 } }, {}]) {
    try { return await navigator.mediaDevices.getUserMedia({ video: { ...base, ...size }, audio: false }); } catch (e) { var err = e; }
  }
  throw err;
}
// Noms lisibles des caméras iPhone (Safari donne des libellés anglais ou français)
function camName(label, i) {
  const l = label.toLowerCase();
  if (/front|avant|facetime/.test(l)) return 'Avant';
  if (/triple/.test(l)) return 'Auto (3 objectifs)';
  if (/dual wide|double grand/.test(l)) return 'Auto (0,5× + 1×)';
  if (/dual|double/.test(l)) return 'Auto (1× + télé)';
  if (/ultra/.test(l)) return 'Ultra grand-angle 0,5×';
  if (/tele/.test(l)) return 'Téléobjectif';
  if (/back|arrière|arriere/.test(l)) return 'Grand-angle 1×';
  return label || 'Caméra ' + (i + 1);
}
async function listCameras() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const cur = track?.getSettings().deviceId;
  $('cam').innerHTML = devs.map((d, i) => `<option value="${d.deviceId}"${d.deviceId === cur ? ' selected' : ''}>${camName(d.label, i)}</option>`).join('');
  return devs;
}
async function useStream(s) {
  stream = s;
  video.srcObject = stream;
  await video.play().catch(() => {});
  if (!video.videoWidth) await new Promise(r => video.onloadedmetadata = r);
  track = stream.getVideoTracks()[0];
  caps = track.getCapabilities ? track.getCapabilities() : {};
  $('hwRow').style.display = 'none'; $('focusRow').style.display = 'none';
  setupCaps();
}
async function switchCamera(id) {
  stream?.getTracks().forEach(t => t.stop());
  try { await useStream(await openStream(id)); } catch (e) { toast('Caméra indisponible'); await useStream(await openStream()); }
  await listCameras();
  defaultCorners(); setMode('aim'); updateStatus();
}
async function startCamera() {
  $('err').textContent = '';
  if (!navigator.mediaDevices?.getUserMedia) { $('err').textContent = 'Caméra indisponible. Ouvre la page en HTTPS.'; return; }
  try {
    let s = await openStream();
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    // Toujours le grand-angle 1× (capteur principal, le plus net) au démarrage
    const pick = devs.find(d => camName(d.label) === 'Grand-angle 1×');
    if (pick && pick.deviceId !== s.getVideoTracks()[0].getSettings().deviceId) {
      s.getTracks().forEach(t => t.stop());
      try { s = await openStream(pick.deviceId); } catch { s = await openStream(); }
    }
    await useStream(s);
  } catch (e) { $('err').textContent = 'Erreur : ' + e.message; return; }
  await listCameras();
  $('start').style.display = 'none';
  defaultCorners(); drawOverlay(); updateStatus();
  initGL(); requestAnimationFrame(loop);
  try { await navigator.wakeLock?.request('screen'); } catch {}
}

function setupCaps() {
  const adv = {};
  if (caps.focusMode?.includes('continuous')) adv.focusMode = 'continuous';
  if (caps.exposureMode?.includes('continuous')) adv.exposureMode = 'continuous';
  if (Object.keys(adv).length) track.applyConstraints({ advanced: [adv] }).catch(() => {});
  if (caps.zoom) {
    const h = $('hw'); h.min = caps.zoom.min; h.max = caps.zoom.max; h.step = caps.zoom.step || 0.1;
    h.value = track.getSettings().zoom || caps.zoom.min;
    $('hwOut').textContent = (+h.value).toFixed(1) + '×'; $('hwRow').style.display = '';
  }
  if (caps.focusDistance && caps.focusMode?.includes('manual')) {
    const f = $('focus'); f.min = caps.focusDistance.min; f.max = caps.focusDistance.max;
    f.step = caps.focusDistance.step || 0.01; f.value = caps.focusDistance.min; $('focusRow').style.display = '';
  }
}
async function setHwZoom(z) {
  z = Math.max(caps.zoom.min, Math.min(caps.zoom.max, z));
  try { await track.applyConstraints({ advanced: [{ zoom: z }] }); } catch {}
  $('hw').value = z; $('hwOut').textContent = z.toFixed(1) + '×'; updateStatus();
  return track.getSettings().zoom || z;
}

// ---------- Conversion écran <-> pixels vidéo (object-fit: contain) ----------
function fitInfo() {
  const vw = video.videoWidth, vh = video.videoHeight, sw = stage.clientWidth, sh = stage.clientHeight;
  const s = Math.min(sw / vw, sh / vh);
  return { s, ox: (sw - vw * s) / 2, oy: (sh - vh * s) / 2 };
}
const toScreen = p => { const f = fitInfo(); return { x: f.ox + p.x * f.s, y: f.oy + p.y * f.s }; };
const toVideo = (x, y) => { const f = fitInfo(); return {
  x: Math.max(0, Math.min(video.videoWidth, (x - f.ox) / f.s)),
  y: Math.max(0, Math.min(video.videoHeight, (y - f.oy) / f.s)) }; };

function defaultCorners() {
  const w = video.videoWidth, h = video.videoHeight;
  corners = [{ x: w * .25, y: h * .3 }, { x: w * .75, y: h * .3 }, { x: w * .75, y: h * .7 }, { x: w * .25, y: h * .7 }];
}
function drawOverlay() {
  if (!corners) return;
  const sp = corners.map(toScreen);
  $('poly').setAttribute('points', sp.map(p => p.x + ',' + p.y).join(' '));
  $('handles').innerHTML = sp.map((p, i) => `<circle data-i="${i}" cx="${p.x}" cy="${p.y}" r="16"/>`).join('');
}

// ---------- Détection de l'écran ----------
// ===== DÉTECTEUR =====
// 1) Bords rectilignes de l'image (Sobel + transformée de Hough)
// 2) On teste toutes les combinaisons haut/bas/gauche/droite autour du point visé
// 3) Chaque quadrilatère est noté selon le contraste continu le long de ses 4 côtés
//    (un écran allumé est plus clair que son cadre), puis les coins sont affinés en haute résolution.
const Det = (() => {
  function blur(src, W, H) {
    const a = new Float32Array(W * H), b = new Float32Array(W * H);
    for (let y = 0; y < H; y++) { const o = y * W;
      for (let x = 0; x < W; x++) a[o + x] = (src[o + (x > 0 ? x - 1 : x)] + 2 * src[o + x] + src[o + (x < W - 1 ? x + 1 : x)]) / 4; }
    for (let y = 0; y < H; y++) { const o = y * W, u = (y > 0 ? y - 1 : y) * W, d = (y < H - 1 ? y + 1 : y) * W;
      for (let x = 0; x < W; x++) b[o + x] = (a[u + x] + 2 * a[o + x] + a[d + x]) / 4; }
    return b;
  }
  function samp(L, W, H, x, y) {
    x = Math.max(0, Math.min(W - 1.001, x)); y = Math.max(0, Math.min(H - 1.001, y));
    const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, i = yi * W + xi;
    return (L[i] * (1 - fx) + L[i + 1] * fx) * (1 - fy) + (L[i + W] * (1 - fx) + L[i + W + 1] * fx) * fy;
  }

  function hough(L, W, H) {
    const N = W * H, gx = new Float32Array(N), gy = new Float32Array(N), mag = new Float32Array(N), hist = new Uint32Array(256);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      const a = (L[i - W + 1] + 2 * L[i + 1] + L[i + W + 1]) - (L[i - W - 1] + 2 * L[i - 1] + L[i + W - 1]);
      const b = (L[i + W - 1] + 2 * L[i + W] + L[i + W + 1]) - (L[i - W - 1] + 2 * L[i - W] + L[i - W + 1]);
      gx[i] = a; gy[i] = b; const m = Math.hypot(a, b) / 4; mag[i] = m; hist[Math.min(255, m | 0)]++;
    }
    // seuil adaptatif : les 30 % de pixels les plus contrastés (entre 6 et 20 niveaux)
    let thr = 6; for (let c = 0, t = 255; t >= 0; t--) { c += hist[t]; if (c > N * 0.3) { thr = Math.max(6, Math.min(20, t)); break; } }
    const diag = Math.ceil(Math.hypot(W, H)), NR = 2 * diag + 1, NT = 180;
    const acc = new Float32Array(NT * NR), cs = new Float32Array(NT), sn = new Float32Array(NT);
    // angles de -45° à 134° : les bords verticaux (≈0°) et horizontaux (≈90°) ne tombent pas sur la coupure
    for (let t = 0; t < NT; t++) { cs[t] = Math.cos((t - 45) * Math.PI / 180); sn[t] = Math.sin((t - 45) * Math.PI / 180); }
    for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
      const i = y * W + x, m = mag[i]; if (m < thr) continue;
      // amincissement : maximum local dans la direction du gradient
      const ux = gx[i] / (m * 4), uy = gy[i] / (m * 4);
      const ox = Math.round(ux), oy = Math.round(uy);
      if (mag[i + oy * W + ox] > m || mag[i - oy * W - ox] >= m) continue;
      let deg = Math.atan2(gy[i], gx[i]) * 180 / Math.PI; if (deg < -45) deg += 180; else if (deg >= 135) deg -= 180;
      const t0 = (Math.round(deg) + 45) % 180;
      for (let dt = -12; dt <= 12; dt++) {
        const t = (t0 + dt + NT) % NT;
        acc[t * NR + Math.round(x * cs[t] + y * sn[t]) + diag] += 1;
      }
    }
    const minV = Math.max(14, Math.min(W, H) * 0.06), peaks = [];
    for (let t = 0; t < NT; t++) for (let r = 0; r < NR; r++) {
      const v = acc[t * NR + r]; if (v < minV) continue;
      let ok = true;
      for (let dt = -1; dt <= 1 && ok; dt++) { const tt = (t + dt + NT) % NT;
        for (let dr = -2; dr <= 2; dr++) { const rr = r + dr; if (rr < 0 || rr >= NR || (!dt && !dr)) continue;
          const w = acc[tt * NR + rr]; if (w > v || (w === v && (dt < 0 || (!dt && dr < 0)))) { ok = false; break; } } }
      if (ok) peaks.push({ deg: t - 45, th: (t - 45) * Math.PI / 180, r: r - diag, v });
    }
    peaks.sort((a, b) => b.v - a.v);
    // supprime les quasi‑doublons (même droite à 1 px / 2° près)
    const kept = [];
    for (const p of peaks) { if (kept.length >= 300) break;
      if (!kept.some(k => Math.abs(k.deg - p.deg) <= 2 && Math.abs(k.r - p.r) <= 2.5)) kept.push(p); }
    return kept;
  }

  function cross(l1, l2) {
    const a1 = Math.cos(l1.th), b1 = Math.sin(l1.th), a2 = Math.cos(l2.th), b2 = Math.sin(l2.th);
    const den = a1 * b2 - a2 * b1; if (Math.abs(den) < 1e-3) return null;
    return { x: (l1.r * b2 - l2.r * b1) / den, y: (a1 * l2.r - a2 * l1.r) / den };
  }
  const area = q => Math.abs(q.reduce((s, p, i) => { const n = q[(i + 1) % 4]; return s + p.x * n.y - n.x * p.y; }, 0)) / 2;
  function convex(q) {
    let sg = 0;
    for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
      const z = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x); if (!sg) sg = Math.sign(z); else if (Math.sign(z) !== sg) return false; }
    return true;
  }
  function inside(q, p) {
    let c = false; for (let i = 0, j = 3; i < 4; j = i++) { const a = q[i], b = q[j];
      if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) c = !c; }
    return c;
  }
  function angleOK(q) {
    for (let i = 0; i < 4; i++) { const a = q[(i + 3) % 4], b = q[i], c = q[(i + 1) % 4];
      const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
      const cos = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y));
      if (Math.abs(cos) > 0.75) return false; }   // angles entre ~41° et ~139°
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const w = (d(q[0], q[1]) + d(q[3], q[2])) / 2, h = (d(q[0], q[3]) + d(q[1], q[2])) / 2;
    return w / h > 0.35 && w / h < 4.5;
  }

  // Note d'un côté : part des points où l'intérieur et l'extérieur diffèrent nettement, avec le même signe
  function sideScore(L, W, H, a, b, cen) {
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    let nx = dy / len, ny = -dx / len;
    if (nx * ((a.x + b.x) / 2 - cen.x) + ny * ((a.y + b.y) / 2 - cen.y) < 0) { nx = -nx; ny = -ny; }
    const m = Math.max(12, Math.min(40, Math.round(len / 4)));
    let pos = 0, neg = 0, sum = 0;
    for (let i = 0; i < m; i++) {
      const t = 0.08 + 0.84 * i / (m - 1), px = a.x + dx * t, py = a.y + dy * t;
      const d = samp(L, W, H, px - nx * 2.5, py - ny * 2.5) - samp(L, W, H, px + nx * 2.5, py + ny * 2.5);
      if (d > 7) pos++; else if (d < -7) neg++;
      sum += d;
    }
    return { s: Math.max(pos, neg) / m, pol: pos >= neg ? 1 : 0.75, c: Math.abs(sum / m) };
  }
  function quadScore(L, W, H, q) {
    const cen = { x: (q[0].x + q[1].x + q[2].x + q[3].x) / 4, y: (q[0].y + q[1].y + q[2].y + q[3].y) / 4 };
    let prod = 1, mn = 1, pol = 1, con = 0;
    for (let e = 0; e < 4; e++) {
      const r = sideScore(L, W, H, q[e], q[(e + 1) % 4], cen);
      if (r.s < 0.4) return 0;
      prod *= r.s; mn = Math.min(mn, r.s); pol *= r.pol; con += Math.min(60, r.c) / 240;
    }
    return Math.pow(prod, 0.75) * mn * pol * (0.15 + con) * Math.pow(area(q), 0.25);
  }

  function detect(Lraw, W, H, seed) {
    const L = blur(Lraw, W, H), lines = hough(L, W, H);
    const s = seed || { x: W / 2, y: H / 2 };
    const top = [], bot = [], lef = [], rig = [];
    for (const l of lines) {
      const c = Math.cos(l.th), sn = Math.sin(l.th);

// Viser : toucher l'écran dans l'image = détecter à cet endroit ; glisser un coin = ajustement (avec loupe).
// Redressé : pincer pour zoomer, glisser pour déplacer, double‑tap = reset.
const loupe = $('loupe'), lctx = loupe.getContext('2d');
function showLoupe(x, y, p) {
  loupe.style.display = 'block';
  loupe.style.left = Math.min(innerWidth - 140, Math.max(10, x - 65)) + 'px';
  loupe.style.top = Math.max(10, y - 190) + 'px';
  const r = 40; // demi‑côté de la zone source en pixels vidéo
  lctx.drawImage(video, p.x - r, p.y - r, 2 * r, 2 * r, 0, 0, 260, 260);
  lctx.strokeStyle = '#4cc2ff'; lctx.lineWidth = 2;
  lctx.beginPath(); lctx.moveTo(130, 110); lctx.lineTo(130, 150); lctx.moveTo(110, 130); lctx.lineTo(150, 130); lctx.stroke();
}
const pts = new Map(); let drag = -1, pinch = null, last = null, lastTap = 0, downAt = null;
stage.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  last = { x: e.clientX, y: e.clientY }; downAt = { x: e.clientX, y: e.clientY, t: Date.now() };
  if (mode === 'aim' && corners) {
    const sp = corners.map(toScreen);
    let bi = -1, bd = 50; sp.forEach((p, i) => { const d = Math.hypot(p.x - e.clientX, p.y - e.clientY); if (d < bd) { bd = d; bi = i; } });
    drag = bi;
  }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z }; drag = -1; }
  const now = Date.now();
  if (mode === 'rect' && pts.size === 1 && now - lastTap < 300) view = { cx: .5, cy: .5, z: 1 };
  lastTap = now;
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'aim') {
    if (drag >= 0) { corners[drag] = toVideo(e.clientX, e.clientY); drawOverlay(); showLoupe(e.clientX, e.clientY, corners[drag]); }
  } else if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()];
    view.z = Math.max(1, Math.min(20, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
  } else if (pts.size === 1 && last) {
    const r = viewRect(glc.clientWidth, glc.clientHeight);
    view.cx = Math.max(0, Math.min(1, view.cx - (e.clientX - last.x) / glc.clientWidth * r.w));
    view.cy = Math.max(0, Math.min(1, view.cy - (e.clientY - last.y) / glc.clientHeight * r.h));
  }
  last = { x: e.clientX, y: e.clientY };
});
const up = e => {
  const wasTap = downAt && pts.size === 1 && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 10 && Date.now() - downAt.t < 350;
  if (mode === 'aim' && wasTap && drag < 0) detectAndFrame(toVideo(e.clientX, e.clientY));
  pts.delete(e.pointerId); drag = -1; loupe.style.display = 'none';
  if (pts.size < 2) pinch = null;
  if (pts.size === 1) last = { ...[...pts.values()][0] };
};
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
window.addEventListener('resize', drawOverlay);
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && track) try { await navigator.wakeLock?.request('screen'); } catch {} });
</script>
