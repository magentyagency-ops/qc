<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Zoom Écran</title>
<style>
  :root { --acc: #4cc2ff; --bg: rgba(20,20,24,.82); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 14px/1.3 -apple-system, system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #overlay polygon { fill: rgba(76,194,255,.12); stroke: var(--acc); stroke-width: 2; }
  #overlay circle { fill: rgba(76,194,255,.35); stroke: #fff; stroke-width: 2; }
  #aimDot { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border: 2px solid #fff;
    border-radius: 50%; box-shadow: 0 0 0 1px #000; pointer-events: none; }
  #loupe { position: fixed; width: 130px; height: 130px; border-radius: 50%; border: 2px solid var(--acc);
    display: none; pointer-events: none; z-index: 7; background: #000; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: none; background: #000; }
  body.rect #gl { display: block; }
  body.rect #video, body.rect #overlay, body.rect #aimDot { visibility: hidden; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; background: #000; }
  #start button { font-size: 18px; padding: 14px 28px; border-radius: 30px; border: 0;
    background: var(--acc); color: #000; font-weight: 600; }
  #err { color: #ff7a7a; max-width: 340px; }
  .bar { position: fixed; left: 0; right: 0; padding: 8px 12px; background: var(--bg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 5; }
  #top { top: 0; padding-top: max(8px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; }
  #bottom { bottom: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .seg { display: flex; background: #111; border-radius: 18px; padding: 2px; border: 1px solid #333; }
  .seg button { border: 0; background: none; color: #fff; padding: 7px 14px; border-radius: 16px; font-size: 13px; }
  .seg button.on { background: var(--acc); color: #000; font-weight: 600; }
  #cam { background: #111; color: #fff; border: 1px solid #444; border-radius: 14px; padding: 6px 8px; font-size: 12px; max-width: 42vw; }
  #status { flex: 1; font-size: 11px; opacity: .75; text-align: right; }
  .row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .row label { width: 84px; font-size: 12px; opacity: .85; flex: none; }
  .row input[type=range] { flex: 1; accent-color: var(--acc); height: 28px; }
  .row output { width: 42px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .btns button { flex: 1 1 auto; min-width: 60px; padding: 10px 6px; border-radius: 10px;
    border: 1px solid #444; background: #222; color: #fff; font-size: 13px; }
  .btns button.on { background: var(--acc); color: #000; border-color: var(--acc); }
  .btns button.main { background: var(--acc); color: #000; border-color: var(--acc); font-weight: 600; }
  #adv { display: none; }
  #adv.open { display: block; }
  .chips { display: flex; gap: 6px; flex: 1; }
  .chips button { flex: 1; padding: 6px 4px; border-radius: 14px; border: 1px solid #555; background: #111; color: #fff; font-size: 12px; }
  .chips button.on { border-color: var(--acc); color: var(--acc); }
  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: var(--bg);
    padding: 8px 14px; border-radius: 16px; font-size: 13px; z-index: 6; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  body.hideui .bar { display: none; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <svg id="overlay"><polygon id="poly"/><g id="handles"></g></svg>
  <div id="aimDot"></div>
  <canvas id="gl"></canvas>
</div>
<canvas id="loupe" width="260" height="260"></canvas>
<div id="toast"></div>

<div id="start">
  <h2 style="margin:0">🖥️ Zoom Écran</h2>
  <p style="opacity:.75;max-width:340px;margin:0">Place le rond blanc sur l’écran d’ordinateur et appuie sur <b>Détecter</b> (ou touche l’écran dans l’image).<br>L’app zoome dessus et l’affiche redressé, comme vu de face.</p>
  <button id="go">Démarrer la caméra</button>
  <div id="err"></div>
</div>

<div id="top" class="bar">
  <div class="seg"><button id="mAim" class="on">Viser</button><button id="mRect">Redressé</button></div>
  <select id="cam"></select>
  <div id="status"></div>
</div>

<div id="bottom" class="bar">
  <div id="adv">
    <div class="row"><label>Format écran</label>
      <div class="chips" id="aspects"><button data-a="0" class="on">Auto</button><button data-a="1.7778">16:9</button><button data-a="1.6">16:10</button><button data-a="1.3333">4:3</button></div></div>
    <div class="row" id="hwRow" style="display:none"><label>Zoom caméra</label><input id="hw" type="range" step="0.1"><output id="hwOut"></output></div>
    <div class="row"><label>Netteté</label><input id="sharp" type="range" min="0" max="3" step="0.1" value="0.6"><output id="sharpOut"></output></div>
    <div class="row"><label>Contraste</label><input id="contrast" type="range" min="50" max="250" step="5" value="120"><output id="contrastOut"></output></div>
    <div class="row"><label>Luminosité</label><input id="bright" type="range" min="30" max="200" step="5" value="100"><output id="brightOut"></output></div>
    <div class="row" id="focusRow" style="display:none"><label>Mise au point</label><input id="focus" type="range"><output id="focusOut">auto</output></div>
  </div>
  <div class="btns">
    <button id="bDetect" class="main">Détecter</button>
    <button id="bTrack">Suivi</button>
    <button id="bFreeze">Figer</button>
    <button id="bSave">Photo</button>
    <button id="bAdv">⚙︎</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), stage = $('stage'), glc = $('gl');
let track = null, caps = {}, stream = null;
let corners = null;            // 4 coins en pixels vidéo : TL, TR, BR, BL
let mode = 'aim', tracking = false, frozen = false, aspect = 0, busy = false;
let view = { cx: .5, cy: .5, z: 1 }; // zoom/déplacement dans la vue redressée

const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.opacity = 0, 2200); }
function updateStatus() {
  if (!track) return;
  const s = track.getSettings();
  $('status').textContent = `${video.videoWidth}×${video.videoHeight}` + (caps.zoom ? ` · zoom ${(s.zoom || 1).toFixed(1)}×/${caps.zoom.max}×` : ' · pas de zoom optique');
}

// ---------- Caméra ----------
async function openStream(deviceId) {
  const base = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: 'environment' } };
  for (const size of [{ width: { ideal: 3840 }, height: { ideal: 2160 } }, { width: { ideal: 1920 }, height: { ideal: 1080 } }, {}]) {
    try { return await navigator.mediaDevices.getUserMedia({ video: { ...base, ...size }, audio: false }); } catch (e) { var err = e; }
  }
  throw err;
}
// Noms lisibles des caméras iPhone (Safari donne des libellés anglais ou français)
function camName(label, i) {
  const l = label.toLowerCase();
  if (/front|avant|facetime/.test(l)) return 'Avant';
  if (/triple/.test(l)) return 'Auto (3 objectifs)';
  if (/dual wide|double grand/.test(l)) return 'Auto (0,5× + 1×)';
  if (/dual|double/.test(l)) return 'Auto (1× + télé)';
  if (/ultra/.test(l)) return 'Ultra grand-angle 0,5×';
  if (/tele/.test(l)) return 'Téléobjectif';
  if (/back|arrière|arriere/.test(l)) return 'Grand-angle 1×';
  return label || 'Caméra ' + (i + 1);
}
async function listCameras() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const cur = track?.getSettings().deviceId;
  $('cam').innerHTML = devs.map((d, i) => `<option value="${d.deviceId}"${d.deviceId === cur ? ' selected' : ''}>${camName(d.label, i)}</option>`).join('');
  return devs;
}
async function useStream(s) {
  stream = s;
  video.srcObject = stream;
  await video.play().catch(() => {});
  if (!video.videoWidth) await new Promise(r => video.onloadedmetadata = r);
  track = stream.getVideoTracks()[0];
  caps = track.getCapabilities ? track.getCapabilities() : {};
  $('hwRow').style.display = 'none'; $('focusRow').style.display = 'none';
  setupCaps();
}
async function switchCamera(id) {
  stream?.getTracks().forEach(t => t.stop());
  try { await useStream(await openStream(id)); } catch (e) { toast('Caméra indisponible'); await useStream(await openStream()); }
  try { localStorage.setItem('cam', id); } catch {}
  await listCameras();
  defaultCorners(); setMode('aim'); updateStatus();
}
async function startCamera() {
  $('err').textContent = '';
  if (!navigator.mediaDevices?.getUserMedia) { $('err').textContent = 'Caméra indisponible. Ouvre la page en HTTPS.'; return; }
  try {
    let s = await openStream();
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    let saved = null; try { saved = localStorage.getItem('cam'); } catch {}
    // Par défaut, la caméra virtuelle « Triple/Double » bascule seule sur le téléobjectif quand on zoome
    const pick = devs.find(d => d.deviceId === saved) || devs.find(d => /triple/i.test(d.label))
      || devs.find(d => /dual wide|double grand/i.test(d.label)) || devs.find(d => /dual|double/i.test(d.label));
    if (pick && pick.deviceId !== s.getVideoTracks()[0].getSettings().deviceId) {
      s.getTracks().forEach(t => t.stop());
      try { s = await openStream(pick.deviceId); } catch { s = await openStream(); }
    }
    await useStream(s);
  } catch (e) { $('err').textContent = 'Erreur : ' + e.message; return; }
  await listCameras();
  $('start').style.display = 'none';
  defaultCorners(); drawOverlay(); updateStatus();
  initGL(); requestAnimationFrame(loop);
  try { await navigator.wakeLock?.request('screen'); } catch {}
}

function setupCaps() {
  const adv = {};
  if (caps.focusMode?.includes('continuous')) adv.focusMode = 'continuous';
  if (caps.exposureMode?.includes('continuous')) adv.exposureMode = 'continuous';
  if (Object.keys(adv).length) track.applyConstraints({ advanced: [adv] }).catch(() => {});
  if (caps.zoom) {
    const h = $('hw'); h.min = caps.zoom.min; h.max = caps.zoom.max; h.step = caps.zoom.step || 0.1;
    h.value = track.getSettings().zoom || caps.zoom.min;
    $('hwOut').textContent = (+h.value).toFixed(1) + '×'; $('hwRow').style.display = '';
  }
  if (caps.focusDistance && caps.focusMode?.includes('manual')) {
    const f = $('focus'); f.min = caps.focusDistance.min; f.max = caps.focusDistance.max;
    f.step = caps.focusDistance.step || 0.01; f.value = caps.focusDistance.min; $('focusRow').style.display = '';
  }
}
async function setHwZoom(z) {
  z = Math.max(caps.zoom.min, Math.min(caps.zoom.max, z));
  try { await track.applyConstraints({ advanced: [{ zoom: z }] }); } catch {}
  $('hw').value = z; $('hwOut').textContent = z.toFixed(1) + '×'; updateStatus();
  return track.getSettings().zoom || z;
}

// ---------- Conversion écran <-> pixels vidéo (object-fit: contain) ----------
function fitInfo() {
  const vw = video.videoWidth, vh = video.videoHeight, sw = stage.clientWidth, sh = stage.clientHeight;
  const s = Math.min(sw / vw, sh / vh);
  return { s, ox: (sw - vw * s) / 2, oy: (sh - vh * s) / 2 };
}
const toScreen = p => { const f = fitInfo(); return { x: f.ox + p.x * f.s, y: f.oy + p.y * f.s }; };
const toVideo = (x, y) => { const f = fitInfo(); return {
  x: Math.max(0, Math.min(video.videoWidth, (x - f.ox) / f.s)),
  y: Math.max(0, Math.min(video.videoHeight, (y - f.oy) / f.s)) }; };

function defaultCorners() {
  const w = video.videoWidth, h = video.videoHeight;
  corners = [{ x: w * .25, y: h * .3 }, { x: w * .75, y: h * .3 }, { x: w * .75, y: h * .7 }, { x: w * .25, y: h * .7 }];
}
function drawOverlay() {
  if (!corners) return;
  const sp = corners.map(toScreen);
  $('poly').setAttribute('points', sp.map(p => p.x + ',' + p.y).join(' '));
  $('handles').innerHTML = sp.map((p, i) => `<circle data-i="${i}" cx="${p.x}" cy="${p.y}" r="16"/>`).join('');
}

// ---------- Détection de l'écran (sans librairie) ----------
// Un écran allumé est une zone lumineuse quasi rectangulaire. On seuille la luminosité,
// on prend la zone qui contient le point visé, puis on ajuste un quadrilatère sur son contour.
const small = document.createElement('canvas');
const sctx = small.getContext('2d', { willReadFrequently: true });

function detectQuad(seed) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const W = 480, k = W / vw, H = Math.round(vh * k), N = W * H;
  small.width = W; small.height = H;
  sctx.drawImage(video, 0, 0, W, H);
  const d = sctx.getImageData(0, 0, W, H).data;
  const L = new Uint8Array(N), hist = new Uint32Array(256);
  for (let i = 0; i < N; i++) { const v = (d[i * 4] * 77 + d[i * 4 + 1] * 150 + d[i * 4 + 2] * 29) >> 8; L[i] = v; hist[v]++; }
  const otsu = otsuThreshold(hist, N);
  const sx = Math.round((seed ? seed.x : vw / 2) * k), sy = Math.round((seed ? seed.y : vh / 2) * k);
  const seedL = L[sy * W + sx];

  let best = null;
  const ths = new Set([otsu, Math.round(otsu * .75), Math.round(otsu * 1.2), Math.round(seedL * .7), Math.round(seedL * .5)]);
  for (const t of ths) {
    if (t < 15 || t > 250) continue;
    const mask = new Uint8Array(N);
    for (let i = 0; i < N; i++) mask[i] = L[i] > t ? 1 : 0;
    closeMask(mask, W, H, 2);
    const comp = pickComponent(mask, W, H, sx, sy);
    if (!comp) continue;
    const q = fitQuad(comp, W, H);
    if (!q) continue;
    const qa = polyArea(q);
    const fill = comp.area / qa;               // proche de 1 si la zone est bien un quadrilatère
    if (qa < N * 0.01 || qa > N * 0.9 || fill < 0.75 || !plausible(q) || q.filter(p => p.edge).length > 1) continue;
    const score = qa * fill * fill * (comp.hasSeed ? 2 : 1) * (q.some(p => p.edge) ? .5 : 1);
    if (!best || score > best.score) best = { score, q };
  }
  return best && best.q.map(p => ({ x: p.x / k, y: p.y / k }));
}

function otsuThreshold(hist, total) {
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, max = 0, th = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue; const wF = total - wB; if (!wF) break;
    sumB += i * hist[i]; const mB = sumB / wB, mF = (sum - sumB) / wF, v = wB * wF * (mB - mF) ** 2;
    if (v > max) { max = v; th = i; }
  }
  return th;
}
// Fermeture morphologique (dilatation puis érosion) pour boucher les trous dus au contenu sombre
function closeMask(m, W, H, r) {
  const tmp = new Uint8Array(m.length);
  const pass = (src, dst, dilate, horiz) => {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = dilate ? 0 : 1;
      for (let o = -r; o <= r; o++) {
        const xx = horiz ? x + o : x, yy = horiz ? y : y + o;
        const s = (xx < 0 || yy < 0 || xx >= W || yy >= H) ? (dilate ? 0 : 1) : src[yy * W + xx];
        if (dilate ? s : !s) { v = dilate ? 1 : 0; break; }
      }
      dst[y * W + x] = v;
    }
  };
  pass(m, tmp, true, true); pass(tmp, m, true, false);
  pass(m, tmp, false, true); pass(tmp, m, false, false);
}
// Composante connexe contenant le point visé (ou la plus grande proche du centre)
function pickComponent(mask, W, H, sx, sy) {
  const lab = new Int32Array(W * H), stack = new Int32Array(W * H);
  let n = 0, chosen = null, seedLab = 0;
  // cherche un pixel allumé près du point visé
  outer: for (let r = 0; r < 25; r += 2) for (let dy = -r; dy <= r; dy += Math.max(1, r)) for (let dx = -r; dx <= r; dx++) {
    const x = sx + dx, y = sy + dy; if (x >= 0 && y >= 0 && x < W && y < H && mask[y * W + x]) { seedLab = y * W + x + 1; break outer; }
  }
  const comps = [];
  const grow = start => {
    n++; let sp = 0, area = 0, touches = false; stack[sp++] = start; lab[start] = n;
    const rowMin = new Int32Array(H).fill(W), rowMax = new Int32Array(H).fill(-1);
    const colMin = new Int32Array(W).fill(H), colMax = new Int32Array(W).fill(-1);
    while (sp) {
      const i = stack[--sp], x = i % W, y = (i / W) | 0; area++;
      if (x < rowMin[y]) rowMin[y] = x; if (x > rowMax[y]) rowMax[y] = x;
      if (y < colMin[x]) colMin[x] = y; if (y > colMax[x]) colMax[x] = y;
      if (x === 0 || y === 0 || x === W - 1 || y === H - 1) touches = true;
      if (x > 0 && mask[i - 1] && !lab[i - 1]) { lab[i - 1] = n; stack[sp++] = i - 1; }
      if (x < W - 1 && mask[i + 1] && !lab[i + 1]) { lab[i + 1] = n; stack[sp++] = i + 1; }
      if (y > 0 && mask[i - W] && !lab[i - W]) { lab[i - W] = n; stack[sp++] = i - W; }
      if (y < H - 1 && mask[i + W] && !lab[i + W]) { lab[i + W] = n; stack[sp++] = i + W; }
    }
    const pts = [];
    for (let y = 0; y < H; y++) if (rowMax[y] >= 0) { pts.push({ x: rowMin[y], y }, { x: rowMax[y] + 1, y }); }
    for (let x = 0; x < W; x++) if (colMax[x] >= 0) { pts.push({ x, y: colMin[x] }, { x, y: colMax[x] + 1 }); }
    return { area, pts, touches };
  };
  if (seedLab) { chosen = grow(seedLab - 1); chosen.hasSeed = true; if (chosen.area > W * H * 0.01) return chosen; }
  // sinon : plus grande zone, pondérée par la proximité du centre
  for (let i = 0; i < W * H; i++) if (mask[i] && !lab[i]) {
    const c = grow(i); if (c.area < W * H * 0.01) continue;
    let cx = 0, cy = 0; for (const p of c.pts) { cx += p.x; cy += p.y; } cx /= c.pts.length; cy /= c.pts.length;
    c.score = c.area * (1 - 0.6 * Math.hypot(cx - W / 2, cy - H / 2) / Math.hypot(W / 2, H / 2));
    comps.push(c);
  }
  comps.sort((a, b) => b.score - a.score);
  return comps[0] || null;
}
function hull(pts) {
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y), cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const q of p) { while (lo.length > 1 && cr(lo.at(-2), lo.at(-1), q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up.length > 1 && cr(up.at(-2), up.at(-1), q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const polyArea = q => Math.abs(q.reduce((s, p, i) => { const n = q[(i + 1) % q.length]; return s + p.x * n.y - n.x * p.y; }, 0)) / 2;

function fitQuad(comp, W, H) {
  const h = hull(comp.pts); if (h.length < 4) return null;
  // 1) quadrilatère d'aire maximale inscrit dans l'enveloppe (amélioration itérative)
  const ext = f => h.reduce((b, p) => f(p) > f(b) ? p : b);
  let idx = [ext(p => -p.x - p.y), ext(p => p.x - p.y), ext(p => p.x + p.y), ext(p => p.y - p.x)].map(p => h.indexOf(p));
  for (let it = 0; it < 6; it++) {
    let changed = false;
    for (let c = 0; c < 4; c++) {
      let bestA = polyArea(idx.map(i => h[i])), bestI = idx[c];
      for (let i = 0; i < h.length; i++) { const t = idx.slice(); t[c] = i; const a = polyArea(t.map(j => h[j])); if (a > bestA + 1e-6) { bestA = a; bestI = i; } }
      if (bestI !== idx[c]) { idx[c] = bestI; changed = true; }
    }
    if (!changed) break;
  }
  let q = orderCorners(idx.map(i => h[i]));
  // 2) affinage : droite ajustée sur les points de contour de chaque côté, puis intersection
  const lines = [];
  for (let e = 0; e < 4; e++) {
    const a = q[e], b = q[(e + 1) % 4], dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    const sel = comp.pts.filter(p => {
      const t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / (len * len);
      return t > .1 && t < .9 && Math.abs((p.x - a.x) * dy - (p.y - a.y) * dx) / len < 3;
    });
    lines.push(sel.length > 8 ? fitLine(sel) : { px: a.x, py: a.y, dx: dx / len, dy: dy / len });
  }
  const out = [];
  for (let c = 0; c < 4; c++) {
    const p = intersect(lines[(c + 3) % 4], lines[c]);
    if (!p || Math.hypot(p.x - q[c].x, p.y - q[c].y) > 0.15 * Math.max(W, H)) out.push({ ...q[c] }); else out.push(p);
  }
  out.forEach(p => p.edge = p.x < 3 || p.y < 3 || p.x > W - 3 || p.y > H - 3);
  return out;
}
function fitLine(pts) {
  let mx = 0, my = 0; for (const p of pts) { mx += p.x; my += p.y; } mx /= pts.length; my /= pts.length;
  let sxx = 0, sxy = 0, syy = 0; for (const p of pts) { const x = p.x - mx, y = p.y - my; sxx += x * x; sxy += x * y; syy += y * y; }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  return { px: mx, py: my, dx: Math.cos(th), dy: Math.sin(th) };
}
function intersect(l1, l2) {
  const den = l1.dx * l2.dy - l1.dy * l2.dx; if (Math.abs(den) < 1e-6) return null;
  const t = ((l2.px - l1.px) * l2.dy - (l2.py - l1.py) * l2.dx) / den;
  return { x: l1.px + t * l1.dx, y: l1.py + t * l1.dy };
}
function orderCorners(pts) {
  const cx = pts.reduce((s, p) => s + p.x, 0) / 4, cy = pts.reduce((s, p) => s + p.y, 0) / 4;
  const s = pts.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  // s est trié dans le sens horaire à partir du haut‑gauche approximatif
  let tl = 0; s.forEach((p, i) => { if (p.x + p.y < s[tl].x + s[tl].y) tl = i; });
  return [0, 1, 2, 3].map(i => s[(tl + i) % 4]);
}
function plausible(o) {
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const w = (d(o[0], o[1]) + d(o[3], o[2])) / 2, h = (d(o[0], o[3]) + d(o[1], o[2])) / 2;
  const r = w / h; return r > 0.4 && r < 4;
}

// ---------- Détection + zoom optique automatique ----------
async function detectAndFrame(seed) {
  if (busy) return; busy = true;
  try {
    let q = detectQuad(seed);
    if (!q) { toast('Écran non trouvé — vise-le avec le rond ou touche-le'); return; }
    corners = q; drawOverlay();
    if (caps.zoom) {
      // Zoom optique pour que l'écran remplisse le cadre : bien plus de pixels utiles qu'un zoom numérique
      const vw = video.videoWidth, vh = video.videoHeight, cur = track.getSettings().zoom || caps.zoom.min;
      const mdx = Math.max(...q.map(p => Math.abs(p.x - vw / 2))), mdy = Math.max(...q.map(p => Math.abs(p.y - vh / 2)));
      const want = cur * Math.min(0.9 * (vw / 2) / mdx, 0.9 * (vh / 2) / mdy);
      if (want > cur * 1.08) {
        toast('Zoom optique…');
        const got = await setHwZoom(want), r = got / cur;
        corners = corners.map(p => ({ x: vw / 2 + (p.x - vw / 2) * r, y: vh / 2 + (p.y - vh / 2) * r }));
        await sleep(700);
        const q2 = detectQuad({ x: vw / 2 + ((seed?.x ?? vw / 2) - vw / 2) * r, y: vh / 2 + ((seed?.y ?? vh / 2) - vh / 2) * r });
        if (q2) corners = q2;
        const free = Math.min((vw / 2) / mdx, (vh / 2) / mdy);
        if (got < caps.zoom.max * 0.98 && free < 1.6) toast('Centre mieux l’écran pour zoomer davantage');
      }
    }
    view = { cx: .5, cy: .5, z: 1 }; setMode('rect'); toast('Écran détecté ✓');
  } finally { busy = false; }
}

function trackStep() {
  const q = detectQuad(centroid(corners));
  if (!q) return;
  const diag = Math.hypot(video.videoWidth, video.videoHeight);
  const jump = Math.max(...q.map((p, i) => Math.hypot(p.x - corners[i].x, p.y - corners[i].y)));
  if (jump > diag * 0.12) return;
  corners = corners.map((p, i) => ({ x: p.x * .5 + q[i].x * .5, y: p.y * .5 + q[i].y * .5 }));
  if (mode === 'aim') drawOverlay();
}
const centroid = c => ({ x: c.reduce((s, p) => s + p.x, 0) / 4, y: c.reduce((s, p) => s + p.y, 0) / 4 });

// ---------- Homographie : (u,v) du carré unité -> coordonnées texture vidéo ----------
function homography(dst) {
  const src = [[0, 0], [1, 0], [1, 1], [0, 1]], A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [u, v] = src[i], [x, y] = dst[i];
    A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); b.push(x);
    A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); b.push(y);
  }
  for (let c = 0; c < 8; c++) {
    let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
    for (let r = c + 1; r < 8; r++) { const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; b[r] -= f * b[c]; }
  }
  const h = new Array(8);
  for (let r = 7; r >= 0; r--) { let s = b[r]; for (let k = r + 1; k < 8; k++) s -= A[r][k] * h[k]; h[r] = s / A[r][r]; }
  h.push(1); return h;
}
function edgeLens() {
  const o = corners, d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  return { w: Math.max(d(o[0], o[1]), d(o[3], o[2])), h: Math.max(d(o[0], o[3]), d(o[1], o[2])) };
}
function screenAspect() { if (aspect) return aspect; const e = edgeLens(); return e.w / e.h; }

// ---------- WebGL : redressement, interpolation bicubique, netteté ----------
let gl, U = {};
function initGL() {
  gl = glc.getContext('webgl', { preserveDrawingBuffer: true });
  const vs = `attribute vec2 p; varying vec2 vUv; void main(){ vUv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
  const fs = `precision highp float;
    uniform sampler2D t; uniform mat3 H; uniform vec2 res; uniform vec4 view;
    uniform float sharp, contrast, bright;
    varying vec2 vUv;
    vec3 tx(vec2 i){ return texture2D(t, (i + .5) / res).rgb; }
    // Catmull‑Rom : agrandit en gardant les bords des caractères nets
    vec3 cubic(vec2 st){
      vec2 p = st * res - .5, i = floor(p), f = p - i;
      vec2 w0 = f*(-.5+f*(1.-.5*f)), w1 = 1.+f*f*(-2.5+1.5*f), w2 = f*(.5+f*(2.-1.5*f)), w3 = f*f*(-.5+.5*f);
      vec3 r0 = tx(i+vec2(-1.,-1.))*w0.x + tx(i+vec2(0.,-1.))*w1.x + tx(i+vec2(1.,-1.))*w2.x + tx(i+vec2(2.,-1.))*w3.x;
      vec3 r1 = tx(i+vec2(-1., 0.))*w0.x + tx(i+vec2(0., 0.))*w1.x + tx(i+vec2(1., 0.))*w2.x + tx(i+vec2(2., 0.))*w3.x;
      vec3 r2 = tx(i+vec2(-1., 1.))*w0.x + tx(i+vec2(0., 1.))*w1.x + tx(i+vec2(1., 1.))*w2.x + tx(i+vec2(2., 1.))*w3.x;
      vec3 r3 = tx(i+vec2(-1., 2.))*w0.x + tx(i+vec2(0., 2.))*w1.x + tx(i+vec2(1., 2.))*w2.x + tx(i+vec2(2., 2.))*w3.x;
      return r0*w0.y + r1*w1.y + r2*w2.y + r3*w3.y;
    }
    void main(){
      vec2 uv = view.xy + vUv * view.zw;
      if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) { gl_FragColor = vec4(.06,.06,.07,1.); return; }
      vec3 q = H * vec3(uv, 1.); vec2 st = q.xy / q.z;
      vec3 c = cubic(st);
      vec2 e = 1. / res;
      vec3 n = texture2D(t, st + vec2(e.x, 0.)).rgb + texture2D(t, st - vec2(e.x, 0.)).rgb
             + texture2D(t, st + vec2(0., e.y)).rgb + texture2D(t, st - vec2(0., e.y)).rgb;
      c = c + sharp * (c - n * .25);
      c = (c - .5) * contrast + .5;
      gl_FragColor = vec4(clamp(c * bright, 0., 1.), 1.);
    }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
                        [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  for (const n of ['H', 'res', 'view', 'sharp', 'contrast', 'bright']) U[n] = gl.getUniformLocation(prog, n);
}

// Région visible de l'écran redressé (coordonnées 0..1), ajustée au canvas puis zoomée/déplacée
function viewRect(cw, ch) {
  const A = screenAspect(), cA = cw / ch;
  const sx = (A > cA ? 1 : cA / A) / view.z, sy = (A > cA ? A / cA : 1) / view.z;
  return { x: view.cx - sx / 2, y: view.cy - sy / 2, w: sx, h: sy };
}
function render(r, w, h, upload) {
  if (glc.width !== w || glc.height !== h) { glc.width = w; glc.height = h; }
  gl.viewport(0, 0, w, h);
  if (upload) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
  const vw = video.videoWidth, vh = video.videoHeight;
  const m = homography(corners.map(p => [p.x / vw, p.y / vh]));
  gl.uniformMatrix3fv(U.H, false, [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]);
  gl.uniform2f(U.res, vw, vh);
  gl.uniform4f(U.view, r.x, r.y, r.w, r.h);
  gl.uniform1f(U.sharp, +$('sharp').value);
  gl.uniform1f(U.contrast, +$('contrast').value / 100);
  gl.uniform1f(U.bright, +$('bright').value / 100);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function renderScreen() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.round(glc.clientWidth * dpr), ch = Math.round(glc.clientHeight * dpr);
  render(viewRect(cw, ch), cw, ch, !frozen);
}

let lastTrack = 0;
function loop(t) {
  if (tracking && !frozen && !busy && t - lastTrack > 300) { lastTrack = t; trackStep(); }
  if (mode === 'rect' && video.readyState >= 2) renderScreen();
  requestAnimationFrame(loop);
}

// ---------- UI ----------
function setMode(m) {
  mode = m; document.body.classList.toggle('rect', m === 'rect');
  $('mAim').classList.toggle('on', m === 'aim'); $('mRect').classList.toggle('on', m === 'rect');
  if (m === 'aim') drawOverlay();
}
$('go').onclick = startCamera;
$('cam').onchange = e => switchCamera(e.target.value);
$('mAim').onclick = () => setMode('aim');
$('mRect').onclick = () => setMode('rect');
$('bDetect').onclick = () => { setMode('aim'); detectAndFrame(null); };
$('bTrack').onclick = e => { tracking = !tracking; e.target.classList.toggle('on', tracking); toast(tracking ? 'Suivi auto activé' : 'Suivi désactivé'); };
$('bFreeze').onclick = e => { frozen = !frozen; e.target.classList.toggle('on', frozen); e.target.textContent = frozen ? 'Reprendre' : 'Figer';
  if (frozen) { setMode('rect'); toast('Image figée — zoome librement'); } };
$('bAdv').onclick = e => { $('adv').classList.toggle('open'); e.target.classList.toggle('on'); };
$('aspects').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  aspect = +b.dataset.a; [...$('aspects').children].forEach(x => x.classList.toggle('on', x === b)); };
for (const id of ['sharp', 'contrast', 'bright']) {
  const upd = () => $(id + 'Out').textContent = id === 'sharp' ? (+$(id).value).toFixed(1) : $(id).value + '%';
  $(id).addEventListener('input', upd); upd();
}
$('hw').oninput = e => { setHwZoom(+e.target.value); };
$('focus').oninput = e => { track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: +e.target.value }] }).catch(() => {});
  $('focusOut').textContent = (+e.target.value).toFixed(2); };

// Photo : rendu de la zone visible à la résolution native de la caméra (pas celle de l'écran du téléphone)
$('bSave').onclick = () => {
  if (mode !== 'rect') setMode('rect');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const vr = viewRect(glc.clientWidth * dpr, glc.clientHeight * dpr);
  const x0 = Math.max(0, vr.x), y0 = Math.max(0, vr.y), x1 = Math.min(1, vr.x + vr.w), y1 = Math.min(1, vr.y + vr.h);
  const e = edgeLens(), A = screenAspect(), srcW = Math.max(e.w, e.h * A);
  let w = Math.round(srcW * (x1 - x0) * 1.5), h = Math.round(srcW / A * (y1 - y0) * 1.5);
  const s = Math.min(1, 4096 / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
  render({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 }, w, h, false);
  glc.toBlob(async blob => {
    const file = new File([blob], `ecran-${Date.now()}.png`, { type: 'image/png' });
    if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch {} }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  }, 'image/png');
};

// ---------- Gestes ----------
// Viser : toucher l'écran dans l'image = détecter à cet endroit ; glisser un coin = ajustement (avec loupe).
// Redressé : pincer pour zoomer, glisser pour déplacer, double‑tap = reset.
const loupe = $('loupe'), lctx = loupe.getContext('2d');
function showLoupe(x, y, p) {
  loupe.style.display = 'block';
  loupe.style.left = Math.min(innerWidth - 140, Math.max(10, x - 65)) + 'px';
  loupe.style.top = Math.max(10, y - 190) + 'px';
  const r = 40; // demi‑côté de la zone source en pixels vidéo
  lctx.drawImage(video, p.x - r, p.y - r, 2 * r, 2 * r, 0, 0, 260, 260);
  lctx.strokeStyle = '#4cc2ff'; lctx.lineWidth = 2;
  lctx.beginPath(); lctx.moveTo(130, 110); lctx.lineTo(130, 150); lctx.moveTo(110, 130); lctx.lineTo(150, 130); lctx.stroke();
}
const pts = new Map(); let drag = -1, pinch = null, last = null, lastTap = 0, downAt = null;
stage.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  last = { x: e.clientX, y: e.clientY }; downAt = { x: e.clientX, y: e.clientY, t: Date.now() };
  if (mode === 'aim' && corners) {
    const sp = corners.map(toScreen);
    let bi = -1, bd = 50; sp.forEach((p, i) => { const d = Math.hypot(p.x - e.clientX, p.y - e.clientY); if (d < bd) { bd = d; bi = i; } });
    drag = bi;
  }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z }; drag = -1; }
  const now = Date.now();
  if (mode === 'rect' && pts.size === 1 && now - lastTap < 300) view = { cx: .5, cy: .5, z: 1 };
  lastTap = now;
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'aim') {
    if (drag >= 0) { corners[drag] = toVideo(e.clientX, e.clientY); drawOverlay(); showLoupe(e.clientX, e.clientY, corners[drag]); }
  } else if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()];
    view.z = Math.max(1, Math.min(20, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
  } else if (pts.size === 1 && last) {
    const r = viewRect(glc.clientWidth, glc.clientHeight);
    view.cx = Math.max(0, Math.min(1, view.cx - (e.clientX - last.x) / glc.clientWidth * r.w));
    view.cy = Math.max(0, Math.min(1, view.cy - (e.clientY - last.y) / glc.clientHeight * r.h));
  }
  last = { x: e.clientX, y: e.clientY };
});
const up = e => {
  const wasTap = downAt && pts.size === 1 && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 10 && Date.now() - downAt.t < 350;
  if (mode === 'aim' && wasTap && drag < 0) detectAndFrame(toVideo(e.clientX, e.clientY));
  pts.delete(e.pointerId); drag = -1; loupe.style.display = 'none';
  if (pts.size < 2) pinch = null;
  if (pts.size === 1) last = { ...[...pts.values()][0] };
};
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
window.addEventListener('resize', drawOverlay);
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && track) try { await navigator.wakeLock?.request('screen'); } catch {} });
</script>
</body>
